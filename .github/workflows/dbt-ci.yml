name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Dados sinteticos: o CI nao depende dos CSVs do Kaggle
      - name: Carregar a camada raw (amostra)
        run: python load_raw.py --sample

      - name: dbt build (modelos + testes)
        run: dbt build --profiles-dir .

      - name: dbt docs generate
        run: dbt docs generate --profiles-dir .

      - name: Publicar a documentacao do dbt como artefato
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            target/index.html
            target/manifest.json
            target/catalog.json
